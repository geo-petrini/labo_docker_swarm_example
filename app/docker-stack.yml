# Example Voting App - stack per Docker Swarm
# Sorgente originale: https://github.com/dockersamples/example-voting-app
#
# Questo file va distribuito con:  docker stack deploy -c docker-stack.yml vote
#
# NB: docker stack NON compila le immagini: ogni nodo le scarica da Docker Hub.
# NB2: questo file funziona SOLO con docker stack, non con compose (più repliche
#      non possono bindare la stessa porta in compose).
#
# VARIANTI DIDATTICHE (commentate):
#   - vincolare il db al manager (la persistenza vive sul volume di quel nodo):
#       db:
#         deploy:
#           placement:
#             constraints: [node.role == manager]
#   - rollout graduale in caso di aggiornamento immagine:
#       vote:
#         deploy:
#           update_config:
#             parallelism: 1
#             delay: 10s
#           restart_policy:
#             condition: on-failure
#   - scaling da un comando (senza toccare il file):
#       docker service scale vote_worker=6
#       docker service scale vote_vote=4

services:

  redis:
    image: redis:alpine
    networks:
      - frontend

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend

  vote:
    image: dockersamples/examplevotingapp_vote
    ports:
      - 8080:80
    networks:
      - frontend
    deploy:
      replicas: 2

  result:
    image: dockersamples/examplevotingapp_result
    ports:
      - 8081:80
    networks:
      - backend

  worker:
    image: dockersamples/examplevotingapp_worker
    networks:
      - frontend
      - backend
    deploy:
      replicas: 2

networks:
  frontend:
  backend:

volumes:
  db-data: